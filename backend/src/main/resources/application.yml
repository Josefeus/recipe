server:
  port: 8080

spring:
  application:
    name: recipe-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recipe}
    username: ${DB_USERNAME:recipe}
    password: ${DB_PASSWORD:recipe}
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  admin:
    token: ${ADMIN_TOKEN:}